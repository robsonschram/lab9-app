# ──────────────────────────────────────────────────────────────
# Pipeline CI/CD – LAB9
# Disciplina: DevOps – Smart Factory – UNISENAI
# ──────────────────────────────────────────────────────────────
# FLUXO:
#   Push na branch develop → Build + Deploy na HOMOL (simulado)
#   Push na branch main    → Build + Deploy na PRD (simulado)
# ──────────────────────────────────────────────────────────────

name: Pipeline LAB9

# ── Quando o pipeline é acionado ──────────────────────────────
on:
  push:
    branches:
      - develop   # qualquer push na develop dispara o pipeline
      - main      # qualquer push na main dispara o pipeline

# ── Variáveis globais ─────────────────────────────────────────
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/lab9-app  # nome completo da imagem

# ══════════════════════════════════════════════════════════════
# JOB 1 — Build e Push da imagem Docker para o Docker Hub
# ══════════════════════════════════════════════════════════════
jobs:
  Build_e_Push:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest  # servidor do GitHub onde o job vai rodar

    steps:
      # Passo 1 — Baixa o código do repositório para o servidor do GitHub
      - name: Checkout do código
        uses: actions/checkout@v3

      # Passo 2 — Faz login no Docker Hub usando os Secrets do GitHub
      - name: Login no Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Passo 3 — Constrói a imagem Docker a partir do Dockerfile
      - name: Build da imagem Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest .

      # Passo 4 — Envia a imagem para o Docker Hub
      - name: Push da imagem para o Docker Hub
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest

# ══════════════════════════════════════════════════════════════
# JOB 2 — Deploy na HOMOL (simulado)
# Executado apenas quando o push é na branch develop
# ══════════════════════════════════════════════════════════════
  Deploy_Homologacao:
    name: Deploy na EC2 HOMOL (simulado)
    runs-on: ubuntu-latest
    needs: Build_e_Push  # só roda após o Build_e_Push terminar com sucesso

    # Condição: só executa se o push foi na branch develop
    if: github.ref == 'refs/heads/develop'

    steps:
      # Simula o deploy na HOMOL sem conexão SSH real
      - name: Simulando deploy na HOMOL
        run: |
          echo "✅ Imagem ${{ env.IMAGE_NAME }}:latest disponível no Docker Hub"
          echo "🚀 Simulando deploy na EC2-HOMOL (IP: 3.89.44.121)"
          echo "   docker pull ${{ env.IMAGE_NAME }}:latest"
          echo "   docker stop app || true"
          echo "   docker rm app || true"
          echo "   docker run -d --name app -p 8080:5000 ${{ env.IMAGE_NAME }}:latest"
          echo "✅ Deploy na HOMOL simulado com sucesso!"
          echo "🌐 API disponível em: http://3.89.44.121:8080"

# ══════════════════════════════════════════════════════════════
# JOB 3 — Deploy na PRD (simulado)
# Executado apenas quando o push é na branch main
# ══════════════════════════════════════════════════════════════
  Deploy_Producao:
    name: Deploy na EC2 PRD (simulado)
    runs-on: ubuntu-latest
    needs: Build_e_Push  # só roda após o Build_e_Push terminar com sucesso

    # Condição: só executa se o push foi na branch main
    if: github.ref == 'refs/heads/main'

    steps:
      # Simula o deploy na PRD sem conexão SSH real
      - name: Simulando deploy na PRD
        run: |
          echo "✅ Imagem ${{ env.IMAGE_NAME }}:latest disponível no Docker Hub"
          echo "🚀 Simulando deploy na EC2-PRD (IP: 3.88.102.169)"
          echo "   docker pull ${{ env.IMAGE_NAME }}:latest"
          echo "   docker stop app || true"
          echo "   docker rm app || true"
          echo "   docker run -d --name app -p 80:5000 ${{ env.IMAGE_NAME }}:latest"
          echo "✅ Deploy na PRD simulado com sucesso!"
          echo "🌐 API disponível em: http://3.88.102.169:80"
